<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jupiter Security Management System | Namibia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen">
      <div class="login-card">
        <div class="logo">
          <h1>JUPITER</h1>
          <p>Security Management System</p>
          <small>Namibia</small>
        </div>
        <form id="login-form">
          <label>Employee Code</label>
          <input type="text" id="login-code" placeholder="e.g. JUP-ADMIN-001" required />
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Password" required />
          <button type="submit">Sign In</button>
          <p id="login-error" class="error"></p>
        </form>
        <p class="hint">Default: JUP-ADMIN-001 / Admin@123</p>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-screen" class="screen hidden">
      <header>
        <div class="brand">Jupiter Security <span>| Namibia</span></div>
        <div class="user-info">
          <span id="user-name"></span>
          <span id="user-role" class="badge"></span>
          <button id="btn-logout" class="btn-outline">Logout</button>
        </div>
      </header>

      <nav id="sidebar">
        <button data-page="dashboard" class="nav-btn active">Dashboard</button>
        <button data-page="guards" class="nav-btn admin-only">Guards</button>
        <button data-page="sites" class="nav-btn admin-only">Sites</button>
        <button data-page="assignments" class="nav-btn admin-only">Assignments</button>
        <button data-page="shifts" class="nav-btn">Shifts</button>
        <button data-page="attendance" class="nav-btn">Attendance</button>
        <button data-page="location" class="nav-btn admin-only">Live Location</button>
        <button data-page="payroll" class="nav-btn">Payroll</button>
        <button data-page="clock" class="nav-btn guard-only">Clock In / Out</button>
      </nav>

      <main id="content">
        <!-- Pages will be injected here -->
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
